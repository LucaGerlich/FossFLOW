server {
    listen 80;
    # Basic authentication (AUTH_BASIC_SETTING replaced by docker-entrypoint.sh)
    auth_basic AUTH_BASIC_SETTING;
    auth_basic_user_file /etc/nginx/.htpasswd;
    server_name localhost;

    # Allow larger request bodies (up to 10MB)
    client_max_body_size 10M;

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # OTLP trace ingest: authenticated by ingest key, not basic auth
    location /api/otlp/ {
        auth_basic off;
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match the backend's 16 MiB limit
        client_max_body_size 16m;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow larger bodies for API requests
        client_max_body_size 10M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
