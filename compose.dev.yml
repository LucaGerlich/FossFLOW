services:
  fossflow:
    build: .
    ports:
      - "3000:80"
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - ENABLE_SERVER_STORAGE=true
      - STORAGE_PATH=/data/diagrams
      - ENABLE_GIT_BACKUP=false
      # Dev only: the published 3001 port bypasses nginx Basic Auth.
      - BACKEND_HOST=0.0.0.0
      - LIVE_ALLOW_UNAUTHENTICATED=true
      - BESZEL_URL=${BESZEL_URL:-}
      - BESZEL_EMAIL=${BESZEL_EMAIL:-}
      - BESZEL_PASSWORD=${BESZEL_PASSWORD:-}
      - HTTP_AUTH_USER=${HTTP_AUTH_USER:-}
      - HTTP_AUTH_PASSWORD=${HTTP_AUTH_PASSWORD:-}
      - PUID=${PUID:-}
      - PGID=${PGID:-}
    volumes:
      - ./diagrams:/data/diagrams
